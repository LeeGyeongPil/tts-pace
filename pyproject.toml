[project]
name = "tts-pace"
version = "0.2.0"
description = "Measure speaking rate (syllables per second of pure speech) and fit TTS output to a target pace: engine knob re-synthesis plus a bounded, pitch-preserving tempo change."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "LeeGyeongPil" }]
keywords = ["tts", "speech", "speaking-rate", "syllables", "dubbing", "audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = ["numpy>=2.0"]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/tts-pace"
Issues = "https://github.com/LeeGyeongPil/tts-pace/issues"

[project.scripts]
tts-pace = "tts_pace.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_pace"]

[tool.pytest.ini_options]
addopts = "-m 'not real'"
testpaths = ["tests"]
markers = ["real: needs a real TTS engine or ffmpeg on this machine (deselected by default)"]
