# 키·모델 없이 mock 모드로 전체 흐름을 검증한다.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·런타임이 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --locked
      - run: uv run pytest -q
        env:
          DEMO_MODE: mock
      - run: uv run tts-pace demo
